version: 59
jobs:
- name: 更新到github与gitee
  executeInSandbox: false
  jobExecutor: local
  steps:
  - type: PushRepository
    name: github
    remoteUrl: https://github.com/zrainpro/shell-ui.git
    userName: zrainice
    passwordSecret: access-token-github
    proxy: http://192.168.50.110:7890
    force: false
    condition: SUCCESSFUL
    optional: false
  - type: PushRepository
    name: gitee
    remoteUrl: https://gitee.com/yufo/shell-ui.git
    userName: 雨鱼
    passwordSecret: access-token-gitee
    force: true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
